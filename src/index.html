<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/assets/icons/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/assets/icons/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/assets/icons/favicon-16x16.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Main | ahathe.dev</title>
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>
        <header id="header" class="header">
            <h2 id="header-domain" class="domain">ahathedev.</h2>
            <button id="header-theme-btn" class="theme-btn">
                <span class="icon moon medium"></span>
            </button>
        </header>
        <main
            hx-get="/pages/home.html"
            hx-trigger="load"
            hx-swap="innerHTML"
        ></main>
        <div id="fab-div" class="fab">
            <button id="fab-menu-btn" class="fab fab-btn">
                <span class="icon x"></span>
            </button>
            <button id="fab-top-btn" class="fab fab-btn">
                <span class="icon arrow-up"></span>
            </button>
        </div>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
