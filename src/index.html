<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/assets/icons/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/assets/icons/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/assets/icons/favicon-16x16.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Landing | ahathe.dev</title>
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>
        <noscript class="noscript">
            <div
                style="
                    font-family: monospace;
                    padding: 2rem;
                    text-align: center;
                "
            >
                <p>ahathe.dev requires JavaScript to run.</p>
                <p>Please enable JS in your browser settings.</p>
            </div>
        </noscript>
        <header id="main-header" class="header">
            <div id="header-items" class="fill">
                <p id="domain-name">ahathe.dev</p>
                <i data-lucide="moon"></i>
            </div>
        </header>

        <div id="fab-div" class="fab">
            <button id="menu-button" class="fab fab-btn">
                <i data-lucide="x"></i>
            </button>
            <button id="top-button" class="fab fab-btn">
                <i data-lucide="arrow-up"></i>
            </button>
        </div>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
